name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  # Called by Release, so that a version is published only once these checks pass.
  workflow_call:

permissions:
  contents: read

# github.workflow is "Release" when called from Release: the group then stays distinct from this
# workflow's own push run on main, so neither cancels the other. The event too: the checks the screenshot commit
# dispatches on a pull request's branch have their own group, so a dispatched run stuck on GitHub's side (queued
# with no job, impossible to cancel) cannot hold the pull request's own runs, nor theirs.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The checks the release makes, before merging: a version bumped in one file only fails the release on main.
      - name: Same version everywhere, and in the changelog
        run: |
          VERSION="$(jq -r .version custom_components/github_card/manifest.json)"
          grep -q "VERSION = \"$VERSION\"" custom_components/github_card/const.py || { echo "::error file=custom_components/github_card/const.py::version $VERSION not found in custom_components/github_card/const.py"; exit 1; }
          grep -q "const VERSION = \"$VERSION\"" src/github-card/core.js || { echo "::error file=src/github-card/core.js::version $VERSION not found in src/github-card/core.js"; exit 1; }
          grep -q "GITHUB_PANEL_VERSION = \"$VERSION\"" src/github-panel/core.js || { echo "::error file=src/github-panel/core.js::version $VERSION not found in src/github-panel/core.js"; exit 1; }
          grep -q "\"version\": \"$VERSION\"" package.json || { echo "::error file=package.json::version $VERSION not found in package.json"; exit 1; }
          test "$(node -p "require('./package-lock.json').version")" = "$VERSION" || { echo "::error file=package-lock.json::package-lock.json is not at $VERSION (npm install)"; exit 1; }
          grep -q "^## $VERSION " CHANGELOG.md || { echo "::error file=CHANGELOG.md::no '## $VERSION' entry in CHANGELOG.md"; exit 1; }
          echo "Version $VERSION everywhere"

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Latest Home Assistant: releases since 2026.3 need Python 3.14 (3.13 would resolve to 2026.2).
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # The served card and panel are assembled from src/ (not committed); the runner's Node is enough.
      - name: Build the frontend
        run: |
          npm ci
          node scripts/build-frontend.mjs

      - name: Install dependencies
        run: pip install -r requirements_test.txt

      - name: Home Assistant version
        run: python -c 'from homeassistant.const import __version__; print(f"::notice::Home Assistant {__version__}")'

      - name: Run tests
        run: pytest
        env:
          DEPRECATIONS_LOG: ${{ runner.temp }}/deprecations.log

      - name: Annotate deprecated calls
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/deprecations.log" ]; then
            sort -u "$RUNNER_TEMP/deprecations.log" | head -n 20 | while IFS= read -r line; do echo "::error::$line"; done
          fi

  card-tests:
    name: Card tests
    runs-on: ubuntu-latest
    # Debian 12 container (Node 22 included): apt goes to the Debian mirrors, not the runner's Ubuntu ones,
    # which kept failing. The job runs as root, hence no sudo below.
    container: node:22-bookworm
    # In a container, run steps default to sh (dash, no pipefail): keep bash.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The workspace is owned by another user than the container's root: let git work in it.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: npm ci

      # The browser download (no apt) is kept apart from its system libraries, so the apt work all
      # sits in one time-boxed, retried step and a hung mirror cannot stall the job.
      - name: Install Chromium for the browser tests
        run: npx playwright install chromium

      - name: Install Chromium system deps
        timeout-minutes: 12
        run: .github/scripts/install-chromium-deps.sh

      # REQUIRE_BROWSER=1: the browser tests (status pill) must run here, a missing Chromium fails the job.
      # npm test assembles the card and the panel from src/ first (pretest)
      - name: Run card tests
        run: npm test
        env:
          REQUIRE_BROWSER: "1"
